name: Fix build syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix invalid object key
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.tsx')
          s = p.read_text(encoding='utf-8')
          old = "السياحة والسفر:'Voyages & tourisme'"
          new = "'السياحة والسفر':'Voyages & tourisme'"
          if old not in s:
              raise SystemExit('Expected syntax pattern was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: quote Arabic service object key"
          git push
