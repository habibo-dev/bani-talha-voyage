name: Fix Vercel build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix build configuration and icons
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('package.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          dev = data.setdefault('devDependencies', {})
          dev['@types/react'] = 'latest'
          dev['@types/react-dom'] = 'latest'
          p.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')

          p = Path('tsconfig.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['compilerOptions']['target'] = 'ES2021'
          data['compilerOptions']['lib'] = ['ES2021', 'DOM', 'DOM.Iterable']
          p.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')

          Path('src/vite-env.d.ts').write_text('/// <reference types="vite/client" />\n', encoding='utf-8')

          p = Path('src/main.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace(',Kaaba,', ',Landmark,')
          s = s.replace('[Kaaba,', '[Landmark,')
          s = s.replace(',Instagram,Facebook,Youtube,', ',')
          s = s.replace('<Kaaba/>', '<Landmark/>')
          s = s.replace('<Instagram/>', '<Globe2/>')
          s = s.replace('<Facebook/>', '<Globe2/>')
          s = s.replace('<Youtube/>', '<Globe2/>')
          s = s.replace('function Kaaba', 'function Landmark')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json tsconfig.json src/vite-env.d.ts src/main.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: complete Vercel build compatibility"
          git push
